<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gökhan ÇİTİL - Yazılım ve Yapay Zeka Geliştiricisi. Modern sistem mimarileri ve otomasyon çözümleri.">
    <title>Gökhan ÇİTİL | AI & Software Developer</title>
    
    <style>
        /* Genel Siyah Tema ve Font Ayarları */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body {
            margin: 0; padding: 0; background-color: #080808; color: #ffffff;
            font-family: 'Inter', sans-serif; overflow-x: hidden;
            height: 100vh; display: flex; flex-direction: column;
            cursor: url('cursor.png'), auto; /* YENİ ÖZEL İMLECİMİZ */
        }

        /* Üst Menü (Navbar) */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 50px; z-index: 10; flex-wrap: wrap; gap: 20px;
        }

        .logo { 
            font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; 
            text-align: center; text-decoration: none; color: #ffffff;
        }
        .logo span { font-weight: 300; font-size: 0.8rem; display: block; letter-spacing: 4px; color: #888; }

        .nav-links { display: flex; gap: 40px; }
        .nav-links a {
            color: #dddddd; text-decoration: none; font-size: 0.85rem;
            font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #ffffff; }

        .social-icons { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .social-icons a {
            color: #ffffff; text-decoration: none; font-size: 0.85rem;
            border: 1px solid #333; padding: 8px 20px; border-radius: 20px;
            transition: all 0.3s; letter-spacing: 1px;
        }
        .social-icons a:hover { background: #fff; color: #000; border-color: #fff; }

        /* Ana İçerik */
        main {
            flex-grow: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            position: relative; z-index: 5; margin-top: -30px;
        }

        h1 { font-size: 5.5rem; font-weight: 900; line-height: 1.1; margin: 0; letter-spacing: -2px; z-index: 2; }

        /* GÖRSEL AYARLARI */
        .center-visual {
            margin-top: 30px; max-width: 550px; width: 90%;
            border-radius: 15px; 
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.05); 
            z-index: 1;
            filter: grayscale(100%); 
            transition: filter 0.6s ease; 
        }

        .center-visual:hover {
            filter: grayscale(0%); 
        }

        .bottom-text {
            position: absolute; bottom: 40px; left: 50px; max-width: 400px;
            text-align: left; color: #999999; font-size: 0.95rem; line-height: 1.6; font-weight: 300;
        }

        /* Uçuşan Objeler */
        .floating-shape {
            position: absolute; border-radius: 50%; filter: blur(80px);
            z-index: 0; animation: float 10s infinite ease-in-out alternate;
        }
        .shape1 { width: 300px; height: 300px; background: rgba(30, 144, 255, 0.1); top: 10%; left: 20%; }
        .shape2 { width: 400px; height: 400px; background: rgba(138, 43, 226, 0.05); bottom: 10%; right: 10%; animation-delay: -5s; }

        @keyframes float { 0% { transform: translateY(0) translateX(0); } 100% { transform: translateY(-40px) translateX(40px); } }

        /* --- MOBİL UYUM (RESPONSIVE) AYARLARI --- */
        @media screen and (max-width: 768px) {
            body { height: auto; min-height: 100vh; }
            header { padding: 20px 15px; flex-direction: column; justify-content: center; gap: 15px; }
            .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            main { margin-top: 20px; padding: 20px 0; }
            h1 { font-size: 2.8rem; padding: 0 15px; }
            .center-visual { margin-top: 20px; }
            .bottom-text { position: relative; bottom: auto; left: auto; text-align: center; margin: 40px auto; padding: 0 20px; }
        }
    </style>
</head>
<body>

    <div class="floating-shape shape1"></div>
    <div class="floating-shape shape2"></div>

    <header>
        <a href="https://gokhancitil.com" class="logo">
            GÖKHAN ÇİTİL
            <span>AI & SOFTWARE</span>
        </a>
        
        <nav class="nav-links">
            <a href="hakkimda.html">Hakkımda</a>
            <a href="uzmanliklar.html">Uzmanlıklar</a>
        </nav>

        <div class="social-icons">
            <a href="https://www.linkedin.com/in/gokhancitil" target="_blank">LinkedIn</a>
            <a href="https://medium.com/@gokhancitil" target="_blank">Medium</a>
            <a href="https://x.com/gokhancitil" target="_blank">Twitter</a>
            <a href="https://instagram.com/gokhancitil" target="_blank">Instagram</a>
            <a href="mailto:gokhancitil@gmail.com">İletişim</a>
        </div>
    </header>

    <main>
        <h1>Fikirlerinizi Koda<br>Dönüştürüyoruz.</h1>
        <img src="gokhancitil-yapay-zeka.jpg" alt="Yapay Zeka" class="center-visual">
    </main>

    <div class="bottom-text">
        Yapay zeka modelleri, modern yazılım mimarileri ve otomasyon 
        çözümlerimizle dijital sistemleri geleceğe hazırlıyoruz. 
        Temiz kod ile fikirleriniz gerçeğe dönüşsün!
    </div>

</body>
</html>
