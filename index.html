<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gökhan ÇİTİL | Premium Scroll Deneyimi</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&display=swap');
        
        body { margin: 0; background: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; cursor: url('imlec.png'), auto;}
        
        /* Her bir ekranı (section) tam boy yapıyoruz */
        section { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; position: relative; }
        
        h1 { font-size: 5rem; margin: 0; font-weight: 900; letter-spacing: -2px; }
        p { font-size: 1.5rem; color: #888; font-weight: 300; }
        
        /* Açılıştaki gizli yazılar */
        .hero-text { opacity: 0; transform: translateY(50px); }
        
        /* İkinci Bölüm: Küçücük başlayıp ekranı kaplayacak olan resim */
        .image-wrapper { width: 300px; height: 300px; overflow: hidden; border-radius: 30px; margin-top: 50px; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.5); }
        
        /* Üçüncü Bölüm: Sen kaydırdıkça sağdan soldan gelecek kutular */
        .services-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .service-box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; width: 250px; border: 1px solid rgba(255,255,255,0.1); opacity: 0; transform: translateY(100px); }
        .service-box h3 { font-size: 1.5rem; margin-top: 0; }
    </style>
</head>
<body>

    <!-- 1. EKRAN: Karşılama -->
    <section class="sec-1">
        <h1 class="hero-text">GÖKHAN ÇİTİL</h1>
        <p class="hero-text">AI & Software Developer</p>
    </section>

    <!-- 2. EKRAN: Kaydırdıkça Büyüyen Resim -->
    <section class="sec-2">
        <div class="image-wrapper">
            <img src="gokhancitil-yapay-zeka.jpg" alt="Yapay Zeka" class="scroll-img">
        </div>
        <h1 class="scroll-title" style="margin-top:40px; opacity:0;">Fikirleri Koda Dönüştürüyoruz</h1>
    </section>

    <!-- 3. EKRAN: Kaydırdıkça Sırayla Beliren Hizmetler -->
    <section class="sec-3">
        <h2 style="font-size: 3rem; margin-bottom: 50px;">Neler Yapıyoruz?</h2>
        <div class="services-container">
            <div class="service-box"><h3>Yapay Zeka</h3><p>Akıllı modellemeler.</p></div>
            <div class="service-box"><h3>SaaS</h3><p>Çoklu acente sistemleri.</p></div>
            <div class="service-box"><h3>Otomasyon</h3><p>Kusursuz arka plan süreçleri.</p></div>
        </div>
    </section>

    <!-- En altta biraz boşluk (scroll bitmesin diye) -->
    <div style="height: 50vh; background: #050505;"></div>

    <!-- SİHİR BURADA BAŞLIYOR: GSAP ve ScrollTrigger Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <script>
        // Kütüphaneyi aktifleştir
        gsap.registerPlugin(ScrollTrigger);

        // 1. AÇILIŞ ANİMASYONU: Site yüklenince yazılar süzülerek gelsin
        gsap.to(".hero-text", { opacity: 1, y: 0, duration: 1.2, stagger: 0.3, ease: "power3.out" });

        // 2. RESİM ANİMASYONU: Sen aşağı kaydırdıkça resim büyüsün ve genişlesin (Scrub: 1 ile tekerleğe bağlanır)
        gsap.to(".image-wrapper", {
            width: "80vw",      // Ekranın %80'i kadar genişle
            height: "60vh",     // Ekranın %60'ı kadar uza
            scrollTrigger: {
                trigger: ".sec-2",
                start: "top 80%",   // Bölüm ekranda %80 göründüğünde başla
                end: "top 20%",     // Tepeye ulaştığında bitir
                scrub: 1            // Fare tekerleğiyle eşzamanlı çalış (Kilit Nokta!)
            }
        });
        
        // Resmin içindeki yakınlaştırmayı sıfırla
        gsap.to(".scroll-img", {
            scale: 1,
            scrollTrigger: { trigger: ".sec-2", start: "top 80%", end: "top 20%", scrub: 1 }
        });

        // Resmin altındaki yazı kaydırdıkça belirtsin
        gsap.to(".scroll-title", {
            opacity: 1, y: -20,
            scrollTrigger: { trigger: ".sec-2", start: "top 40%", end: "top 20%", scrub: 1 }
        });

        // 3. KUTU ANİMASYONU: Hizmet kutuları sen oraya gelince sırayla alttan çıksın
        gsap.to(".service-box", {
            opacity: 1, y: 0, stagger: 0.2, // Her biri arasında 0.2 saniye gecikme
            scrollTrigger: { trigger: ".sec-3", start: "top 70%", end: "top 30%", scrub: 1 }
        });
    </script>
</body>
</html>
