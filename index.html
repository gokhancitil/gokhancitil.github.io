<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Google Tag ayarların burada aynen kalacak -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gökhan ÇİTİL | 3D Deneyim</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&display=swap');
        
        /* Sayfanın yüksekliği: Ne kadar büyük olursa kaydırma o kadar uzun sürer */
        body { margin: 0; height: 500vh; background: #050505; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; cursor: url('imlec.png'), auto; }
        
        /* 3D Kamera Perspektifi */
        .viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; perspective: 1200px; overflow: hidden; }
        
        /* Tüm sahnelerin içinde durduğu uzay boşluğu */
        .scene { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.1s linear; }
        
        /* Her bir elementin (katmanın) ortak özelliği */
        .layer { position: absolute; top: 50%; left: 50%; text-align: center; width: 80%; max-width: 800px; }
        
        /* KATMANLARIN DERİNLİKLERİ (Z Ekseni) */
        /* Katman 1: Tam karşımızda */
        .layer-1 { transform: translate(-50%, -50%) translateZ(0px); }
        
        /* Katman 2: Ekranın 1500px gerisinde */
        .layer-2 { transform: translate(-50%, -50%) translateZ(-1500px); }
        
        /* Katman 3: Ekranın 3000px gerisinde */
        .layer-3 { transform: translate(-50%, -50%) translateZ(-3000px); }
        
        /* Katman 4: Ekranın 4500px gerisinde */
        .layer-4 { transform: translate(-50%, -50%) translateZ(-4500px); }

        /* Tasarım Detayları */
        h1 { font-size: 6rem; font-weight: 900; letter-spacing: -3px; margin: 0; background: linear-gradient(135deg, #fff, #555); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-size: 3rem; font-weight: 700; }
        p { font-size: 1.5rem; color: #888; font-weight: 300; }
        
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 50px; border-radius: 30px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        .glass-card img { width: 100%; max-width: 400px; border-radius: 15px; margin-top: 20px; filter: grayscale(100%); transition: 0.5s; }
        .glass-card img:hover { filter: grayscale(0%); }
    </style>
</head>
<body>

    <!-- Sabit Kamera / Görüş Alanı -->
    <div class="viewport">
        <!-- İleri doğru hareket edecek olan uzay -->
        <div class="scene" id="scene">
            
            <div class="layer layer-1">
                <h1>GÖKHAN ÇİTİL</h1>
                <p>AI & Software Developer</p>
            </div>
            
            <div class="layer layer-2">
                <div class="glass-card">
                    <h2>Fikirleri Koda<br>Dönüştürüyoruz</h2>
                    <img src="gokhancitil-yapay-zeka.jpg" alt="Yapay Zeka">
                </div>
            </div>
            
            <div class="layer layer-3">
                <h1 style="font-size: 5rem;">SAAS & OTOMASYON</h1>
                <p>Modern mimariler ile sıfır risk, maksimum performans.</p>
            </div>
            
            <div class="layer layer-4">
                <div class="glass-card">
                    <h2>Projeye Başla</h2>
                    <p>Bağlantılar ve İletişim Formu Buraya Gelecek</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Scroll (Kaydırma) İşlemini Z Eksenine Bağlayan Script -->
    <script>
        // Sayfa kaydırıldıkça çalışacak fonksiyon
        window.addEventListener('scroll', () => {
            // Ne kadar aşağı kaydırdığımızı piksel olarak alıyoruz
            const scrollPozisyonu = window.scrollY;
            
            // Sahneyi Z ekseninde (bize doğru) kaydırdığımız piksel kadar itiyoruz
            document.getElementById('scene').style.transform = `translateZ(${scrollPozisyonu}px)`;
        });
    </script>

</body>
</html>
