<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gökhan ÇİTİL | 3D WebGL Arayüz</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #050508; /* Tam o resimdeki gibi derin koyu lacivert/siyah */
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; /* Kaydırma çubuğunu gizle, tam ekran deneyim */
        }

        /* Sol taraftaki Yazı Alanı */
        .content {
            position: absolute;
            top: 50%;
            left: 8%;
            transform: translateY(-50%);
            z-index: 10;
            max-width: 600px;
            pointer-events: none; /* Fare 3D nesneye etki etsin diye yazıyı geçirgen yapıyoruz */
        }

        .subtitle {
            color: #00e5ff;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 700;
        }

        h1 {
            font-size: 5rem;
            line-height: 1.1;
            font-weight: 900;
            margin: 0 0 20px 0;
            letter-spacing: -2px;
        }

        p {
            font-size: 1.2rem;
            color: #a0aab2;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            pointer-events: auto; /* Butonlara tıklanabilsin */
        }

        .btn-primary {
            background: #6a1b9a; /* Mor buton */
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover { background: #8e24aa; transform: scale(1.05); }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* 3D Modelin Çizileceği Tuval */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Sol Taraf Yazı İçeriği (Resimdeki Tasarım) -->
    <div class="content">
        <div class="subtitle">3D WEB · AI KREATİF · YAZILIM</div>
        <h1>Fikirler biter.<br>Sistem başlar.</h1>
        <p>Yapay zeka modelleri, modern yazılım mimarileri ve otomasyon çözümlerimizle dijital sistemleri geleceğe hazırlıyoruz.</p>
        <div class="btn-group">
            <button class="btn-primary">Randevu Al</button>
            <button class="btn-secondary">WhatsApp'tan yazın</button>
        </div>
    </div>

    <!-- Sağ Taraf 3D Animasyon Alanı -->
    <div id="webgl-container"></div>

    <!-- THREE.JS KÜTÜPHANESİ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. SAHNE, KAMERA VE RENDER KURULUMU
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        // 2. TAŞLARIN (KRİSTALLERİN) OLUŞTURULMASI
        const particleGroup = new THREE.Group();
        scene.add(particleGroup);

        // Keskin 3D Geometri (Tetrahedron - 4 yüzlü piramit/taş)
        const geometry = new THREE.TetrahedronGeometry(1.2, 0); 
        
        // Işığı yansıtan mor/mavi parlak materyal
        const material = new THREE.MeshStandardMaterial({
            color: 0x4a148c,      // Koyu Mor
            emissive: 0x1a0b2e,   // Hafif parlama
            roughness: 0.2,       // Yüzey pürüzlülüğü
            metalness: 0.8,       // Metalik yansıma
            flatShading: true     // Keskin köşeleri belli et
        });

        // Küre şeklinde 600 adet taş yerleştiriyoruz
        for(let i = 0; i < 600; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            
            // Taşları rastgele bir küre (sphere) formunda dağıt
            const radius = 18 + Math.random() * 6; // Kürenin çapı
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            mesh.position.x = radius * Math.sin(phi) * Math.cos(theta);
            mesh.position.y = radius * Math.sin(phi) * Math.sin(theta);
            mesh.position.z = radius * Math.cos(phi);
            
            // Taşların kendi eksenlerindeki rastgele açıları
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;
            mesh.rotation.z = Math.random() * Math.PI;
            
            particleGroup.add(mesh);
        }

        // 3. IŞIKLANDIRMA (Taşların o 3D hacmini göstermek için çok önemli)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0x00e5ff, 1.5); // Mavi ışık vuruyor
        dirLight1.position.set(10, 10, 10);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xaa00ff, 1.5); // Mor ışık vuruyor
        dirLight2.position.set(-10, -10, 10);
        scene.add(dirLight2);

        // Küreyi ekranın sağ tarafına (ve biraz geriye) itiyoruz
        particleGroup.position.x = 25; 
        camera.position.z = 40;

        // 4. FARE HAREKETİ İLE ETKİLEŞİM (Parallax Efekti)
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        });

        // 5. ANİMASYON DÖNGÜSÜ (Kendi etrafında dönme ve fareye tepki)
        function animate() {
            requestAnimationFrame(animate);

            // Küre kendi etrafında yavaşça sürekli döner
            particleGroup.rotation.y += 0.002;
            particleGroup.rotation.x += 0.001;

            // Fareye doğru hafifçe eğilme efekti
            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;
            
            particleGroup.rotation.y += 0.05 * (targetX - particleGroup.rotation.y);
            particleGroup.rotation.x += 0.05 * (targetY - particleGroup.rotation.x);

            renderer.render(scene, camera);
        }
        animate();

        // Ekran boyutu değiştiğinde yapıyı bozmaması için
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
