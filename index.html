<!DOCTYPE html>
<html lang="tr">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gökhan ÇİTİL | Yapay Zeka ve Yazılım</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; cursor: url('imlec.png'), auto; }
        
        /* Hareketli Arka Plan Işıkları */
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6; animation: drift 15s infinite alternate; z-index: -1; }
        .orb-1 { width: 500px; height: 500px; background: #3b82f6; top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -50px; right: -50px; animation-delay: -5s; }
        @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        /* Cam Efektli Ana Kutu */
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 50px; width: 90%; max-width: 1000px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 40px; flex-wrap: wrap; gap: 20px;}
        .logo-img { width: 250px; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        h1 { font-size: 3.5rem; font-weight: 700; margin: 0; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.8; max-width: 600px; margin: 20px auto; }
        
        .image-wrapper { margin: 30px auto; width: 100%; max-width: 500px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .image-wrapper img { width: 100%; display: block; transition: transform 0.5s; }
        .image-wrapper:hover img { transform: scale(1.05); }

        .social-icons { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .social-icons a { padding: 10px 25px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; color: #fff; text-decoration: none; font-size: 0.9rem; transition: all 0.3s; }
        .social-icons a:hover { background: #3b82f6; border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        
        @media (max-width: 768px) { header { flex-direction: column; } h1 { font-size: 2.2rem; } .glass-card { padding: 30px 15px; } }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="glass-card">
        <header>
            <img src="gokhancitil.com.png" alt="Logo" class="logo-img">
            <nav class="nav-links">
                <a href="hakkimda.html">Hakkımda</a>
                <a href="uzmanliklar.html">Uzmanlıklar</a>
                <a href="hizmetlerimiz.html">Hizmetlerimiz</a>
                <a href="iletisim.html">İletişim</a>
            </nav>
        </header>

        <main>
            <h1>Fikirlerinizi Koda<br>Dönüştürüyoruz.</h1>
            <p>Yapay zeka modelleri, modern yazılım mimarileri ve otomasyon çözümlerimizle dijital sistemleri geleceğe hazırlıyoruz. Temiz kod ile fikirleriniz gerçeğe dönüşsün!</p>
            
            <div class="image-wrapper"><img src="gokhancitil-yapay-zeka.jpg" alt="Yapay Zeka"></div>

            <div class="social-icons">
                <a href="https://www.linkedin.com/in/gokhancitil" target="_blank">LinkedIn</a>
                <a href="https://github.com/gokhancitil" target="_blank">GitHub</a>
                <a href="https://instagram.com/gokhancitil" target="_blank">Instagram</a>
            </div>
        </main>
    </div>
</body>
</html>
